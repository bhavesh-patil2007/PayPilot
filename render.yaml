services:
  - type: web
    name: paypilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false

  - type: web
    name: paypilot-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && VITE_API_BASE_URL="https://${PAYPILOT_API_HOST}/api/v1" npm run build
    staticPublishPath: dist
    envVars:
      - key: PAYPILOT_API_HOST
        fromService:
          type: web
          name: paypilot-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
